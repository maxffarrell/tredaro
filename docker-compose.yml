# Self-host Tredaro with Postgres: `BETTER_AUTH_SECRET=$(openssl rand -hex 32) docker compose up -d`
services:
  app:
    image: tredaro:local
    build: .
    pull_policy: build
    env_file:
      - path: .env
        required: false
    ports: ['3000:3000']
    volumes: ['uploads:/app/data']
    environment:
      DATABASE_URL: postgres://tredaro:${POSTGRES_PASSWORD:-tredaro}@db:5432/tredaro
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      TREDARO_ENTERPRISE_KEY: ${TREDARO_ENTERPRISE_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tredaro
      # The fallback is local-development only. Set a persistent URL-safe random
      # POSTGRES_PASSWORD before creating a production database volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tredaro}
      POSTGRES_DB: tredaro
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tredaro']
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
